[project]
name = "todo-list"
version = "1.0.0"
description = "Django To-Do List Application"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django==6.1",
    "dj-database-url==3.1.2",
    "psycopg2-binary==2.9.12",
    "sqlparse==0.6.0",
    "tzdata==2026.3",
    "whitenoise==6.12.0"
]

[tool.vercel]
entrypoint = "Project.wsgi:application"